<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BillShield — Hospital Bill Auditor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>!function(){var s=localStorage.getItem('billshield-theme'),d=window.matchMedia('(prefers-color-scheme:dark)').matches;if(!(s?s==='dark':d))document.documentElement.classList.add('light')}()</script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* ── Tokens — dark default, matches landing.html ────────── */
    :root {
      --bg:          #0E0E10;
      --bg-2:        #15151A;
      --ink:         #F4F1EA;
      --ink-dim:     #9A968D;
      --line:        #26262C;
      --accent:      #2F9E5E;
      --accent-soft: #7BE0B5;

      /* semantic aliases kept for app compatibility */
      --surface:     #15151A;
      --surface-alt: #1C1C22;
      --text:        #F4F1EA;
      --text-2:      #C8C4B8;
      --muted:       #9A968D;
      --border:      #26262C;

      --red:         #E05252;
      --red-bg:      rgba(224,82,82,0.13);
      --green:       #2F9E5E;
      --green-bg:    rgba(47,158,94,0.13);
      --amber:       #D4943A;
      --amber-bg:    rgba(212,148,58,0.13);

      --display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif;
      --body:    -apple-system, BlinkMacSystemFont, 'SF Pro Text',    'Inter', system-ui, sans-serif;

      --radius:  12px;
      --max-w:   920px;
      --nav-h:   58px;
    }

    html.light {
      --bg:          #F4F1EA;
      --bg-2:        #ECE7DC;
      --surface:     #ECE7DC;
      --surface-alt: #E2DBCC;
      --text:        #14140F;
      --text-2:      #3C3830;
      --muted:       #5C594F;
      --border:      #D9D3C5;
      --red-bg:      rgba(220,82,82,0.09);
      --green-bg:    rgba(47,158,94,0.09);
      --amber-bg:    rgba(212,148,58,0.09);
    }

    /* ── Reset ──────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--body);
      font-size: 15px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      transition: background .25s, color .25s;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }

    /* ── Nav — blur backdrop, brand dot, icon-btn toggle ───── */
    .nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: color-mix(in oklab, var(--bg) 85%, transparent);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      max-width: 1280px;
      margin: 0 auto;
      height: var(--nav-h);
    }
    .nav-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--display);
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
      text-decoration: none;
    }
    .nav-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 16px var(--accent);
      flex-shrink: 0;
    }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .nav-about {
      font-size: 0.875rem;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s;
    }
    .nav-about:hover { color: var(--text); }
    .icon-btn {
      width: 36px; height: 36px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .icon-btn:hover { background: var(--surface-alt); }

    /* ── Page wrapper ───────────────────────────────────────── */
    .page     { max-width: var(--max-w); margin: 0 auto; padding: 4rem 2rem; }
    .page--sm { max-width: 540px; }
    .page--lg { max-width: 1060px; }

    /* ── Typography ─────────────────────────────────────────── */
    .display {
      font-family: var(--display);
      font-size: clamp(2.4rem, 5vw, 3.8rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.05;
    }
    .heading {
      font-family: var(--display);
      font-size: 1.85rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }
    .label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── Buttons — pill shape like landing.html ─────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 10px 20px;
      font-family: var(--body);
      font-size: 0.9rem;
      font-weight: 500;
      border-radius: 999px;
      border: 1px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      transition: transform .15s ease, opacity 0.15s, background .2s, color .2s;
      text-decoration: none;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn--dark  { background: var(--accent); color: #fff; }
    .btn--dark:not(:disabled):hover { transform: translateY(-1px); }
    .btn--outline { background: transparent; color: var(--text); border-color: var(--border); }
    .btn--outline:not(:disabled):hover { background: var(--surface-alt); }
    .btn--ghost   { background: transparent; color: var(--muted); border: none; font-size: 0.875rem; padding-left: 0; padding-right: 0; }
    .btn--ghost:hover { color: var(--text); }

    /* ── Upload screen ──────────────────────────────────────── */
    .upload-wrap {
      min-height: calc(100svh - var(--nav-h));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .upload-inner { max-width: 480px; width: 100%; margin: 0 auto; text-align: center; }
    .dropzone {
      border: 1.5px dashed var(--border);
      border-radius: 14px;
      background: var(--surface);
      padding: 3rem 2rem;
      min-height: 196px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      margin-top: 2.5rem;
    }
    .dropzone:hover, .dropzone--over { border-color: var(--accent); background: var(--green-bg); }
    .dropzone--ready { border-style: solid; border-color: var(--accent); background: var(--green-bg); }
    .dz-icon    { width: 34px; height: 34px; color: var(--muted); margin-bottom: 0.875rem; }
    .dz-label   { font-weight: 500; margin-bottom: 0.3rem; }
    .dz-hint    { font-size: 0.875rem; color: var(--muted); }
    .dz-check   { font-size: 1.6rem; color: var(--accent); margin-bottom: 0.4rem; }
    .dz-name    { font-weight: 600; margin-bottom: 0.2rem; }
    .dz-size    { font-size: 0.875rem; color: var(--muted); }
    .dz-change  { display: inline-block; margin-top: 0.5rem; font-size: 0.8rem; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
    .trust-row  { display: flex; gap: 1.75rem; margin-top: 2rem; flex-wrap: wrap; justify-content: center; }
    .trust-item { display: flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; color: var(--muted); }
    .trust-dot  { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); flex-shrink: 0; }

    /* ── Processing screen ──────────────────────────────────── */
    .proc-wrap  { max-width: 500px; margin: 0 auto; padding: 6rem 2rem; }
    .proc-title { font-family: var(--display); font-size: 1.6rem; font-weight: 600; letter-spacing: -0.02em; color: var(--text); margin-bottom: 3rem; }
    .proc-stage { margin-bottom: 2.25rem; }
    .proc-stage-head {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }
    .proc-stage-head--active { color: var(--text-2); }
    .proc-steps  { display: flex; flex-direction: column; gap: 0.5rem; }
    .proc-step   { display: flex; align-items: center; gap: 0.6rem; font-size: 0.875rem; color: var(--text-2); animation: stepIn 0.3s ease both; }
    .proc-step--pending { color: var(--muted); }
    .proc-check  { color: var(--accent); font-size: 0.9rem; flex-shrink: 0; width: 14px; }
    .proc-spinner {
      width: 12px; height: 12px;
      border: 1.5px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      flex-shrink: 0;
    }
    .proc-waiting { display: flex; align-items: center; gap: 0.6rem; font-size: 0.875rem; color: var(--muted); margin-top: 1rem; }
    .proc-error-box {
      background: var(--red-bg);
      border: 1px solid color-mix(in oklab, var(--red) 40%, transparent);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
    }
    .proc-error-title { font-weight: 600; color: var(--red); margin-bottom: 0.4rem; }
    .proc-error-msg   { font-size: 0.875rem; color: var(--text-2); margin-bottom: 1rem; }

    @keyframes stepIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin   { to { transform: rotate(360deg); } }

    /* ── Sanity screen ──────────────────────────────────────── */
    .sanity-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--surface);
      margin-top: 1.5rem;
    }
    @media (max-width: 680px) {
      .sanity-split { grid-template-columns: 1fr; }
      .sanity-panel { height: 250px; }
      .sanity-panel + .sanity-panel { border-left: none; border-top: 1px solid var(--border); height: auto; max-height: 320px; }
    }
    .sanity-panel { display: flex; flex-direction: column; height: 500px; }
    .sanity-panel + .sanity-panel { border-left: 1px solid var(--border); }
    .sanity-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.65rem 1.25rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .sanity-head-label { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
    .sanity-head-count { font-size: 0.78rem; color: var(--muted); }
    .preview-frame { width: 100%; flex: 1; border: none; display: block; }
    .preview-img   { width: 100%; flex: 1; object-fit: contain; display: block; background: var(--surface-alt); }
    .item-scroll   { flex: 1; overflow-y: auto; }
    .item-row      { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 0.6rem 1.25rem; border-bottom: 1px solid var(--border); font-size: 0.875rem; }
    .item-row:last-child { border-bottom: none; }
    .item-name   { font-weight: 500; }
    .item-qty    { font-size: 0.78rem; color: var(--muted); margin-top: 0.1rem; }
    .item-amount { font-weight: 600; font-variant-numeric: tabular-nums; flex-shrink: 0; }

    /* ── Results screen ─────────────────────────────────────── */
    /* Summary card — proof-card gradient from landing.html */
    .summary-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: linear-gradient(180deg, var(--bg-2), var(--bg));
      padding: 1.5rem 2rem;
      margin-bottom: 0.75rem;
    }
    .summary-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.5rem;
      padding-bottom: 1.25rem;
      margin-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
    }
    @media (max-width: 640px) { .summary-stats { grid-template-columns: 1fr 1fr; } }
    .stat-label { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.35rem; }
    .stat-value { font-family: var(--display); font-size: 2.1rem; font-weight: 600; letter-spacing: -0.02em; line-height: 1; }
    .stat-value--red { color: var(--red); }
    .summary-actions { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    .summary-note { font-size: 0.8rem; color: var(--muted); margin-bottom: 1.75rem; }

    .section-label-results {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 2rem;
      margin-bottom: 0.6rem;
    }
    .section-label-results--red   { color: var(--red); }
    .section-label-results--amber { color: var(--amber); }
    .section-label-results--green { color: var(--green); }

    /* Flag cards — .row style from landing.html */
    .flag-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 10px;
      background: var(--surface);
    }
    .flag-card--amber { }
    .flag-card--green { }
    .flag-top        { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
    .flag-name       { font-weight: 600; font-size: 0.9rem; margin-bottom: 0.2rem; }
    .flag-citation   { font-size: 0.78rem; color: var(--muted); }
    .flag-right      { text-align: right; flex-shrink: 0; }
    .flag-amount        { font-weight: 700; font-size: 0.95rem; font-variant-numeric: tabular-nums; color: var(--red); }
    .flag-amount--green { color: var(--accent); }

    /* Badge — pill shape, color-mix tint like landing.html */
    .badge {
      display: inline-block;
      background: color-mix(in oklab, var(--accent) 18%, transparent);
      color: var(--accent);
      border: 1px solid color-mix(in oklab, var(--accent) 40%, transparent);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      margin-top: 0.25rem;
    }
    .badge--red {
      background: color-mix(in oklab, var(--red) 15%, transparent);
      color: var(--red);
      border-color: color-mix(in oklab, var(--red) 35%, transparent);
    }
    .badge--amber {
      background: color-mix(in oklab, var(--amber) 15%, transparent);
      color: var(--amber);
      border-color: color-mix(in oklab, var(--amber) 35%, transparent);
    }

    .flag-meta      { display: flex; gap: 1.5rem; margin-top: 0.5rem; font-size: 0.78rem; }
    .flag-benchmark { color: var(--muted); }
    .flag-delta     { color: var(--red); font-weight: 500; }

    .collapse-trigger { display: flex; align-items: center; justify-content: space-between; cursor: pointer; padding: 0.35rem 0; user-select: none; }
    .collapse-trigger:hover .label { color: var(--text); }
    .chevron { width: 14px; height: 14px; color: var(--muted); transition: transform 0.2s; flex-shrink: 0; }
    .chevron--open { transform: rotate(180deg); }

    .results-cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      align-items: start;
      margin-top: 0.75rem;
    }
    @media (max-width: 640px) { .results-cols { grid-template-columns: 1fr; } }

    /* ── Letter screen — proof-card gradient ────────────────── */
    .letter-note {
      background: var(--amber-bg);
      border: 1px solid color-mix(in oklab, var(--amber) 40%, transparent);
      border-radius: var(--radius);
      padding: 0.6rem 1rem;
      font-size: 0.82rem;
      color: var(--amber);
      margin-bottom: 1rem;
    }
    .letter-box {
      background: linear-gradient(180deg, var(--bg-2), var(--bg));
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 3rem;
      white-space: pre-wrap;
      font-family: var(--display);
      font-size: 0.875rem;
      line-height: 1.85;
      max-height: 580px;
      overflow-y: auto;
    }
    .letter-actions { margin-top: 1.25rem; display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; }

    /* ── Shared feedback ────────────────────────────────────── */
    .notice {
      background: var(--amber-bg);
      border: 1px solid color-mix(in oklab, var(--amber) 40%, transparent);
      border-radius: var(--radius);
      padding: 0.65rem 1rem;
      font-size: 0.875rem;
      color: var(--amber);
      margin-bottom: 1rem;
    }
    .error {
      background: var(--red-bg);
      border: 1px solid color-mix(in oklab, var(--red) 35%, transparent);
      border-radius: var(--radius);
      padding: 0.65rem 1rem;
      font-size: 0.875rem;
      color: var(--red);
      margin-top: 0.75rem;
    }

    /* ── Split results/letter layout ─────────────────────── */
    .results-split {
      display: grid;
      grid-template-columns: 55fr 45fr;
      align-items: start;
    }
    .results-left {
      position: sticky;
      top: var(--nav-h);
      max-height: calc(100vh - var(--nav-h));
      overflow-y: auto;
      padding: 2.5rem 2rem;
      border-right: 1px solid var(--border);
    }
    .results-right {
      padding: 2.5rem 2rem;
      min-height: calc(100vh - var(--nav-h));
    }
    .letter-box--split { max-height: 420px; }
    @media (max-width: 768px) {
      .results-split { grid-template-columns: 1fr; }
      .results-left { position: static; max-height: none; border-right: none; border-bottom: 1px solid var(--border); }
    }

    /* Pulsing loading dots */
    .pulse-dots { display: inline-flex; gap: 2px; align-items: center; margin-left: 4px; }
    .pulse-dot {
      display: inline-block;
      animation: pulseDot 1.4s ease-in-out infinite;
      color: var(--accent);
      font-size: 1.1rem;
      line-height: 1;
    }
    .pulse-dot:nth-child(2) { animation-delay: 0.2s; }
    .pulse-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulseDot { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

    /* Typewriter cursor */
    .tw-cursor {
      display: inline-block; width: 2px; height: 1em;
      background: var(--accent); margin-left: 1px;
      vertical-align: text-bottom;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    /* ── Mobile responsive ─────────────────────────────────── */
    @media (max-width: 640px) {
      .nav-about { display: none; }
      .upload-wrap { padding: 2rem 1.25rem; }
      .upload-inner { max-width: 100%; }
      .display { font-size: 2.2rem; }
      .dropzone { padding: 2rem 1.25rem; min-height: 160px; }
      .proc-wrap { padding: 3rem 1.25rem; }
      .letter-actions { flex-direction: column; align-items: stretch; }
      .letter-actions .btn { width: 100%; justify-content: center; }
      .letter-box { padding: 1.5rem 1.25rem; }
      .page { padding: 2rem 1.25rem; }
    }

    /* ── Print ──────────────────────────────────────────────── */
    @media print {
      .nav, .letter-actions, .summary-card, .section-label-results { display: none !important; }
      .letter-box { border: none; max-height: none; padding: 0; background: white; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useCallback, useEffect } = React;
const API = 'http://localhost:8080';
const fmt = n => '₹' + Number(n).toLocaleString('en-IN');

// ── Icons ──────────────────────────────────────────────────────────────

function IconUpload() {
  return (
    <svg className="dz-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="17 8 12 3 7 8"/>
      <line x1="12" y1="3" x2="12" y2="15"/>
    </svg>
  );
}

function IconSun() {
  return (
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="5"/>
      <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
      <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
    </svg>
  );
}

function IconMoon() {
  return (
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  );
}

function Chevron({ open }) {
  return (

// ── Screen 1: Upload ──────────────────────────────────────────────────

const UPLOAD_STATUS = ['Reading document…', 'Extracting line items…', 'Checking confidence…', 'Almost done…'];

function UploadScreen({ onDone }) {
  const [file,     setFile]     = useState(null);
  const [over,     setOver]     = useState(false);
  const [error,    setError]    = useState(null);
  const [phase,    setPhase]    = useState('idle');
  const [msgIdx,   setMsgIdx]   = useState(0);
  const [apiData,  setApiData]  = useState(null);
  const [apiError, setApiError] = useState(null);
  const doneRef  = useRef(false);
  const inputRef = useRef(null);

  const VALID_TYPES = ['application/pdf', 'image/jpeg', 'image/png'];
  const MAX = 10 * 1024 * 1024;

  const pick = f => {
    if (!f) return;
    if (!VALID_TYPES.includes(f.type)) { setError('Please upload a PDF, JPG, or PNG file.'); return; }
    if (f.size > MAX) { setError('File exceeds 10 MB. Please compress or crop it.'); return; }
    setError(null);
    setFile(f);
  };

  const onDrop = useCallback(e => { e.preventDefault(); setOver(false); pick(e.dataTransfer.files[0]); }, []);
  const sizeLabel = f => f.size < 1e6 ? (f.size / 1024).toFixed(0) + ' KB' : (f.size / 1e6).toFixed(1) + ' MB';

  // Kick off fetch when phase changes to 'processing'
  useEffect(() => {
    if (phase !== 'processing') return;
    const ctrl = new AbortController();
    const form = new FormData();
    form.append('file', file);
    fetch(`${API}/api/extract`, { method: 'POST', body: form, signal: ctrl.signal })
      .then(r => r.ok ? r.json() : r.json().then(j => Promise.reject(j.error || `Server ${r.status}`)))
      .then(data => setApiData(data))
      .catch(err => { if (err.name !== 'AbortError') setApiError(String(err)); });
    return () => ctrl.abort();
  }, [phase]);

  // Cycle status message every 2s while waiting
  useEffect(() => {
    if (phase !== 'processing' || apiData) return;
    if (msgIdx >= UPLOAD_STATUS.length - 1) return;
    const t = setTimeout(() => setMsgIdx(i => i + 1), 2000);
    return () => clearTimeout(t);
  }, [phase, msgIdx, apiData]);

  // Navigate shortly after API responds
  useEffect(() => {
    if (!apiData || doneRef.current) return;
    doneRef.current = true;
    const t = setTimeout(() => onDone(file, apiData), 700);
    return () => clearTimeout(t);
  }, [apiData]);

  const processing = phase === 'processing';

  if (apiError) {
    return (
      <div className="upload-wrap">
        <div className="upload-inner">
          <div className="proc-error-box" role="alert">
            <div className="proc-error-title">Something went wrong</div>
            <div className="proc-error-msg">{apiError}</div>
            <button className="btn btn--outline" onClick={() => { setPhase('idle'); setApiError(null); setMsgIdx(0); setApiData(null); doneRef.current = false; }}>Try again</button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="upload-wrap">
      <div className="upload-inner">
        <h1 className="display" style={{ marginBottom: '1rem' }}>Know what<br />you owe.</h1>
        <p style={{ color: 'var(--muted)', fontSize: '1rem', lineHeight: 1.65, maxWidth: 420, textAlign: 'center' }}>
          Upload your hospital bill. We check every line against verified government rates.
        </p>

        <div
          className={`dropzone ${over && !processing ? 'dropzone--over' : ''} ${file ? 'dropzone--ready' : ''}`}
          onClick={() => !processing && inputRef.current.click()}
          onDrop={e => !processing && onDrop(e)}
          onDragOver={e => { if (!processing) { e.preventDefault(); setOver(true); } }}
          onDragLeave={() => setOver(false)}
          role="button"
          tabIndex={processing ? -1 : 0}
          aria-label="Upload bill"
          onKeyDown={e => e.key === 'Enter' && !processing && inputRef.current.click()}
          style={{ cursor: processing ? 'default' : 'pointer' }}
        >
          <input ref={inputRef} type="file" accept=".pdf,.jpg,.jpeg,.png" style={{ display: 'none' }} onChange={e => pick(e.target.files[0])} aria-hidden="true" />
          {file ? (
            <>
              <div className="dz-check" aria-hidden="true">✓</div>
              <div className="dz-name">{file.name}</div>
              <div className="dz-size">{sizeLabel(file)}</div>
              {!processing && <span className="dz-change">Change file</span>}
            </>
          ) : (
            <>
              <IconUpload />
              <div className="dz-label">Drop your bill here, or click to browse</div>
              <div className="dz-hint">PDF, JPG, PNG · Max 10 MB</div>
            </>
          )}
        </div>

        {error && !processing && <div className="error" role="alert">{error}</div>}

        <div style={{ marginTop: '1.5rem' }}>
          <button
            className="btn btn--dark"
            style={{ minWidth: 180 }}
            disabled={!file || processing}
            onClick={() => setPhase('processing')}
          >
            {processing
              ? <><span className="proc-spinner" style={{ borderColor: 'rgba(255,255,255,0.3)', borderTopColor: '#fff' }} /> Auditing…</>
              : 'Analyse Bill →'}
          </button>
        </div>

        {processing && (
          <p style={{ marginTop: '0.75rem', fontSize: '0.875rem', color: 'var(--accent)', animation: 'stepIn 0.3s ease both' }} aria-live="polite">
            {apiData ? 'Done ✓' : UPLOAD_STATUS[msgIdx]}
          </p>
        )}

        {!processing && (
          <div className="trust-row" aria-label="Trust signals">
            <div className="trust-item"><span className="trust-dot" aria-hidden="true" />Verified CGHS rates</div>
            <div className="trust-item"><span className="trust-dot" aria-hidden="true" />No login required</div>
            <div className="trust-item"><span className="trust-dot" aria-hidden="true" />Your data never stored</div>
          </div>
        )}
      </div>
    </div>
  );
}

// ── Screen 2: Processing ───────────────────────────────────────────────

const PROC_STEPS = [
  { stage: 0, text: 'Reading document structure' },
  { stage: 0, text: 'Identifying hospital and accreditation' },
  { stage: 0, text: 'Extracting line items' },
  { stage: 0, text: 'Checking confidence levels' },
  { stage: 0, text: 'Redacting personal information' },
  { stage: 1, text: 'Loading CGHS rate schedule (Oct 2025)' },
  { stage: 1, text: 'Checking Tier I / Tier II / Tier III rates' },
  { stage: 1, text: 'Comparing each line item' },
  { stage: 1, text: 'Checking CGHS Annexure-III bundled items' },
  { stage: 1, text: 'Applying accreditation adjustments' },
  { stage: 1, text: 'Computing overcharge amounts' },
  { stage: 2, text: 'Verifying citations' },
  { stage: 2, text: 'Checking ₹2,500 threshold' },
  { stage: 2, text: 'Finalising report' },
];
const STAGE_TITLES = ['Extracting bill', 'Analysing against benchmarks', 'Preparing results'];

function ProcessingScreen({ file, onDone, onBack }) {
  const [shown, setShown]       = useState(0);
  const [apiData, setApiData]   = useState(null);
  const [apiError, setApiError] = useState(null);
  const doneRef = useRef(false);

  useEffect(() => {
    const ctrl = new AbortController();
    const form = new FormData();
    form.append('file', file);
    fetch(`${API}/api/extract`, { method: 'POST', body: form, signal: ctrl.signal })
      .then(r => r.ok ? r.json() : r.json().then(j => Promise.reject(j.error || `Server ${r.status}`)))
      .then(data => setApiData(data))
      .catch(err => { if (err.name !== 'AbortError') setApiError(String(err)); });
    return () => ctrl.abort();
  }, []);

  useEffect(() => {
    if (shown >= PROC_STEPS.length) return;
    const delay = apiData ? 80 : (380 + Math.random() * 180);
    const t = setTimeout(() => setShown(s => s + 1), delay);
    return () => clearTimeout(t);
  }, [shown, apiData]);

  useEffect(() => {
    if (apiData && shown >= 4 && !doneRef.current) {
      doneRef.current = true;
      const t = setTimeout(() => onDone(apiData), 350);
      return () => clearTimeout(t);
    }
  }, [apiData, shown]);

  if (apiError) {
    return (
      <div className="proc-wrap">
        <div className="proc-error-box" role="alert">
          <div className="proc-error-title">Something went wrong</div>
          <div className="proc-error-msg">{apiError}</div>
          <button className="btn btn--outline" onClick={onBack}>Start over</button>
        </div>
      </div>
    );
  }

  const currentStage = shown > 0 ? PROC_STEPS[Math.min(shown - 1, PROC_STEPS.length - 1)].stage : 0;
  const allDone = shown >= PROC_STEPS.length;

  return (
    <div className="proc-wrap" aria-live="polite" aria-label="Processing your bill">
      <div className="proc-title">Auditing your bill…</div>
      {STAGE_TITLES.map((title, si) => {
        if (si > currentStage) return null;
        const stageSteps    = PROC_STEPS.filter(s => s.stage === si);
        const stageStart    = PROC_STEPS.findIndex(s => s.stage === si);
        const shownInStage  = Math.max(0, Math.min(stageSteps.length, shown - stageStart));
        const isActive      = si === currentStage;

        return (
          <div className="proc-stage" key={si}>
            <div className={`proc-stage-head ${isActive ? 'proc-stage-head--active' : ''}`}>
              {si < currentStage ? '✓ ' : ''}{title}
            </div>
            <div className="proc-steps">
              {stageSteps.slice(0, shownInStage).map((step, idx) => (
                <div className="proc-step" key={idx}>
                  <span className="proc-check" aria-hidden="true">✓</span>
                  <span>{step.text}</span>
                </div>
              ))}
              {isActive && shownInStage < stageSteps.length && (
                <div className="proc-step proc-step--pending" key="current">
                  <span className="proc-spinner" aria-hidden="true" />
                  <span>{stageSteps[shownInStage].text}</span>
                </div>
              )}
            </div>
          </div>
        );
      })}
      {allDone && !apiData && (
        <div className="proc-waiting">
          <span className="proc-spinner" aria-hidden="true" />
          <span>Still processing…</span>
        </div>
      )}
    </div>
  );
}

// ── Screen 2b: Sanity Check ────────────────────────────────────────────

const ANALYSE_STEPS = [
  { stage: 0, text: 'Loading CGHS rate schedule (Oct 2025)' },
  { stage: 0, text: 'Comparing each line item' },
  { stage: 0, text: 'Checking CGHS Annexure-III bundled items' },
  { stage: 0, text: 'Applying accreditation adjustments' },
  { stage: 0, text: 'Computing overcharge amounts' },
  { stage: 1, text: 'Verifying citations' },
  { stage: 1, text: 'Checking ₹2,500 threshold' },
  { stage: 1, text: 'Finalising report' },
];
const ANALYSE_STAGE_TITLES = ['Analysing against benchmarks', 'Preparing results'];

function SanityScreen({ file, extracted, onDone, onBack }) {
  const [analysing,  setAnalysing]  = useState(false);
  const [shown,      setShown]      = useState(0);
  const [apiResult,  setApiResult]  = useState(null);
  const [error,      setError]      = useState(null);
  const doneRef = useRef(false);
  const fileURL = useRef(URL.createObjectURL(file)).current;
  const isPDF   = file.type === 'application/pdf';
  const items   = extracted.line_items || [];
  const hosp    = extracted.hospital   || {};

  const confirm = () => {
    setAnalysing(true); setError(null);
    fetch(`${API}/api/analyze`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(extracted),
    })
      .then(r => r.ok ? r.json() : r.json().catch(() => ({})).then(j => Promise.reject(j.error || `Server ${r.status}`)))
      .then(data => setApiResult(data))
      .catch(e => {
        setError(e.message && e.message.includes('fetch') ? 'Cannot reach server. Is app.py running?' : String(e));
        setAnalysing(false);
      });
  };

  // Step animation while analysing
  useEffect(() => {
    if (!analysing) return;
    if (shown >= ANALYSE_STEPS.length) return;
    const delay = apiResult ? 80 : (400 + Math.random() * 160);
    const t = setTimeout(() => setShown(s => s + 1), delay);
    return () => clearTimeout(t);
  }, [analysing, shown, apiResult]);

  // Navigate when API done and at least 3 steps shown
  useEffect(() => {
    if (apiResult && shown >= 3 && !doneRef.current) {
      doneRef.current = true;
      setTimeout(() => onDone(apiResult), 300);
    }
  }, [apiResult, shown]);

  const currentStage = analysing && shown > 0
    ? ANALYSE_STEPS[Math.min(shown - 1, ANALYSE_STEPS.length - 1)].stage
    : 0;
  const allDone = shown >= ANALYSE_STEPS.length;

  return (
    <div className="page page--lg">
      <h2 className="heading" style={{ marginBottom: '0.3rem' }}>Does this look right?</h2>
      {hosp.name && (
        <p style={{ color: 'var(--muted)', fontSize: '0.875rem' }}>
          {hosp.name}{hosp.city ? `, ${hosp.city}` : ''}
        </p>
      )}

      <div className="sanity-split" role="region" aria-label="Bill comparison">
        <div className="sanity-panel">
          <div className="sanity-head">
            <span className="sanity-head-label">Your bill</span>
          </div>
          {isPDF
            ? <iframe src={fileURL} className="preview-frame" title="Original bill" />
            : <img src={fileURL} className="preview-img" alt="Original bill" />
          }
        </div>
        <div className="sanity-panel">
          <div className="sanity-head">
            <span className="sanity-head-label">What we extracted</span>
            <span className="sanity-head-count">{items.length} items</span>
          </div>
          <div className="item-scroll" role="list" aria-label="Extracted line items">
            {items.map((item, i) => (
              <div className="item-row" key={i} role="listitem">
                <div>
                  <div className="item-name">{item.item_name}</div>
                  {item.quantity > 1 && <div className="item-qty">Qty {item.quantity}</div>}
                </div>
                <div className="item-amount">{fmt(item.total)}</div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {error && <div className="error" role="alert">{error}</div>}

      {!analysing ? (
        <div style={{ marginTop: '1.5rem', display: 'flex', gap: '1.25rem', alignItems: 'center' }}>
          <button className="btn btn--dark" onClick={confirm}>
            This looks right — Analyse →
          </button>
          <button className="btn btn--ghost" onClick={onBack}>Something's wrong — start over</button>
        </div>
      ) : (
        <div style={{ marginTop: '1.75rem' }} aria-live="polite">
          {ANALYSE_STAGE_TITLES.map((title, si) => {
            if (si > currentStage) return null;
            const stageSteps   = ANALYSE_STEPS.filter(s => s.stage === si);
            const stageStart   = ANALYSE_STEPS.findIndex(s => s.stage === si);
            const shownInStage = Math.max(0, Math.min(stageSteps.length, shown - stageStart));
            const isActive     = si === currentStage;
            return (
              <div className="proc-stage" key={si}>
                <div className={`proc-stage-head ${isActive ? 'proc-stage-head--active' : ''}`}>
                  {si < currentStage ? '✓ ' : ''}{title}
                </div>
                <div className="proc-steps">
                  {stageSteps.slice(0, shownInStage).map((step, idx) => (
                    <div className="proc-step" key={idx}>
                      <span className="proc-check" aria-hidden="true">✓</span>
                      <span>{step.text}</span>
                    </div>
                  ))}
                  {isActive && shownInStage < stageSteps.length && (
                    <div className="proc-step proc-step--pending" key="current">
                      <span className="proc-spinner" aria-hidden="true" />
                      <span>{stageSteps[shownInStage].text}</span>
                    </div>
                  )}
                </div>
              </div>
            );
          })}
          {allDone && !apiResult && (
            <div className="proc-waiting">
              <span className="proc-spinner" aria-hidden="true" />
              <span>Still processing…</span>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

  const printAsPDF = () => {
    const w = window.open('', '_blank');
    w.document.write(`<!DOCTYPE html><html><head><title>Dispute Letter — BillShield</title>
      <style>body{font-family:Georgia,serif;font-size:12pt;line-height:1.9;padding:3cm 3.5cm;color:#000;max-width:none;}pre{white-space:pre-wrap;font-family:inherit;}</style>
      </head><body><pre>${letter.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</pre>
      <script>window.onload=()=>{window.print();}<\/script></body></html>`);
    w.document.close();
  };

  const copyLetter = () => {
    navigator.clipboard.writeText(letter).then(() => { setCopied(true); setTimeout(() => setCopied(false), 2200); });
  };

  // Typewriter effect — runs when letterPhase becomes 'typing'
  useEffect(() => {
    if (letterPhase !== 'typing' || !letter) return;
    let i = 0;
    setTypeText('');
    const iv = setInterval(() => {
      i++;
      setTypeText(letter.slice(0, i));
      if (i >= letter.length) { clearInterval(iv); setLetterPhase('ready'); }
    }, 6);
    return () => clearInterval(iv);
  }, [letterPhase]);

  // Reusable results content (JSX variable, not a component — avoids remounting)
  const resultsContent = (
    <>
      <div className="summary-card" role="region" aria-label="Analysis summary">
        <div className="summary-stats">
          <div>
            <div className="stat-label">Total flagged</div>
            <div className="stat-value stat-value--red" aria-label={`Total flagged ${fmt(analysis.total_flagged_amount || 0)}`}>{fmt(analysis.total_flagged_amount || 0)}</div>
          </div>
          <div>
            <div className="stat-label">Issues found</div>
            <div className="stat-value">{flags.length}</div>
          </div>
          <div>
            <div className="stat-label">Rate overcharges</div>
            <div className="stat-value">{rateFlags.length}</div>
          </div>
          <div>
            <div className="stat-label">Structural violations</div>
            <div className="stat-value">{structFlags.length}</div>
          </div>
        </div>
        <div className="summary-actions">
          {analysis.letter_warranted
            ? <button className="btn btn--dark" style={{ flex: 1 }} disabled={loading || letterPhase !== 'none'} onClick={getLetter}>
                {loading ? 'Drafting…' : letterPhase !== 'none' ? 'Letter generated ✓' : 'Generate Dispute Letter'}
              </button>
            : <button className="btn btn--outline" style={{ flex: 1 }} disabled aria-disabled="true">Dispute letter not warranted</button>
          }
          <button className="btn btn--outline" onClick={saveRecords}>Save for records</button>
          <button className="btn btn--outline" onClick={saveResultsPDF}>Save Results as PDF</button>
        </div>
      </div>

      <p className="summary-note">
        Figures based on verified CGHS benchmarks only. Results are consistent across runs for verified items.
      </p>

      {!analysis.letter_warranted && (
        <div className="notice" role="status">{analysis.letter_threshold_note || 'Total flagged amount is below the ₹2,500 threshold. No dispute letter is warranted at this time.'}</div>
      )}
      {error && <div className="error" role="alert">{error}</div>}

      {(rateFlags.length > 0 || structFlags.length > 0) && (
        <div className="results-cols">
          <div>
            {rateFlags.length > 0 && (
              <>
                <div className="section-label-results section-label-results--red" aria-label={`${rateFlags.length} rate overcharges`}>Rate overcharges ({rateFlags.length})</div>
                {rateFlags.map((f, i) => (
                  <div className="flag-card" key={i} role="article" aria-label={`Rate overcharge: ${f.item_name}`}>
                    <div className="flag-top">
                      <div style={{ flex: 1 }}>
                        <div className="flag-name">{f.item_name}</div>
                        <div className="flag-citation">{f.citation}</div>
                      </div>
                      <div className="flag-right">
                        <div className="flag-amount">{fmt(f.billed_amount)}</div>
                        {f.multiplier && <div><span className="badge badge--red">{f.multiplier}×</span></div>}
                      </div>
                    </div>
                    <div className="flag-meta">
                      <span className="flag-benchmark">Benchmark: {fmt(f.cghs_rate)}</span>
                      <span className="flag-delta">Overcharge: +{fmt(f.delta)}</span>
                    </div>
                  </div>
                ))}
              </>
            )}
          </div>
          <div>
            {structFlags.length > 0 && (
              <>
                <div className="section-label-results section-label-results--red">Structural violations ({structFlags.length})</div>
                {structFlags.map((f, i) => (
                  <div className="flag-card" key={i} role="article" aria-label={`Structural violation: ${f.item_name}`}>
                    <div className="flag-top">
                      <div style={{ flex: 1 }}>
                        <div className="flag-name">{f.item_name}</div>
                        <div className="flag-citation">{f.citation}</div>
                      </div>
                      <div className="flag-right">
                        <div className="flag-amount">{fmt(f.billed_amount)}</div>
                        <div><span className="badge badge--red">not billable</span></div>
                      </div>
                    </div>
                  </div>
                ))}
              </>
            )}
          </div>
        </div>
      )}

      {unverifiable.length > 0 && (
        <div style={{ marginTop: '1.5rem' }}>
          <div className="collapse-trigger" onClick={() => setUnverOpen(o => !o)} role="button" tabIndex={0} aria-expanded={unverOpen} onKeyDown={e => e.key === 'Enter' && setUnverOpen(o => !o)}>
            <span className="label" style={{ color: 'var(--amber)' }}>Could not verify — no benchmark found ({unverifiable.length})</span>
            <Chevron open={unverOpen} />
          </div>
          {unverOpen && (
            <div style={{ marginTop: '0.5rem' }}>
              {unverifiable.map((u, i) => (
                <div className="flag-card flag-card--amber" key={i}>
                  <div className="flag-name">{u.item_name}</div>
                  <div className="flag-citation" style={{ marginTop: '0.2rem' }}>{u.reason}</div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {cleanItems.length > 0 && (
        <div style={{ marginTop: '1.5rem' }}>
          <div className="collapse-trigger" onClick={() => setCleanOpen(o => !o)} role="button" tabIndex={0} aria-expanded={cleanOpen} onKeyDown={e => e.key === 'Enter' && setCleanOpen(o => !o)}>
            <span className="label" style={{ color: 'var(--green)' }}>Within benchmark ({cleanItems.length})</span>
            <Chevron open={cleanOpen} />
          </div>
          {cleanOpen && (
            <div style={{ marginTop: '0.5rem' }}>
              {cleanItems.map((item, i) => (
                <div className="flag-card flag-card--green" key={i}>
                  <div className="flag-top">
                    <div className="flag-name">{item.item_name}</div>
                    <div className="flag-amount flag-amount--green">{fmt(item.total)}</div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </>
  );

  // Letter right panel content
  const letterPanel = (
    <>
      <p className="label" style={{ color: 'var(--muted)', marginBottom: '1.25rem', letterSpacing: '0.12em' }}>Dispute Letter</p>
      {letterPhase === 'loading' && (
        <div style={{ paddingTop: '3rem', textAlign: 'center' }}>
          <p style={{ fontFamily: 'var(--display)', fontSize: '1.05rem', fontWeight: 600, display: 'flex', alignItems: 'center', justifyContent: 'center', flexWrap: 'wrap', gap: '4px', marginBottom: '0.75rem' }}>
            Drafting your dispute letter
            <span className="pulse-dots" aria-hidden="true">
              <span className="pulse-dot">·</span>
              <span className="pulse-dot">·</span>
              <span className="pulse-dot">·</span>
            </span>
          </p>
          <p style={{ color: 'var(--muted)', fontSize: '0.875rem' }}>This usually takes 15–30 seconds.</p>
        </div>
      )}
      {(letterPhase === 'typing' || letterPhase === 'ready') && (
        <>
          <p style={{ fontSize: '0.8rem', color: 'var(--green)', fontWeight: 500, marginBottom: '0.6rem' }}>Ready to send</p>
          <div className="letter-note" role="note">
            Review before sending. Fill in [Admission Date] and [Discharge Date] manually if they appear.
          </div>
          <div className="letter-box letter-box--split" tabIndex={0} aria-label="Dispute letter content">
            {letterPhase === 'typing' ? typeText : letter}
            {letterPhase === 'typing' && <span className="tw-cursor" aria-hidden="true" />}
          </div>
          <div className="letter-actions" style={{ marginTop: '1rem' }}>
            <button className="btn btn--dark"    onClick={downloadLetter}>Download .txt</button>
            <button className="btn btn--outline" onClick={printAsPDF}>Print / Save as PDF</button>
            <button className="btn btn--outline" onClick={copyLetter}>{copied ? '✓ Copied' : 'Copy text'}</button>
          </div>
          <div style={{ borderTop: '1px solid var(--border)', marginTop: '2rem', paddingTop: '2rem' }}>
            <h3 style={{ fontFamily: 'var(--display)', fontSize: '1.05rem', fontWeight: 600, letterSpacing: '-0.01em', margin: '0 0 0.4rem 0' }}>
              Want a legal expert to review this?
            </h3>
            <p style={{ color: 'var(--muted)', fontSize: '0.875rem', lineHeight: 1.65, margin: '0 0 1rem 0' }}>
              Connect with a legal advisor for ₹2,500–₹3,000 per consultation.
            </p>
            <a href="/advisors.html" target="_blank" rel="noopener noreferrer" className="btn btn--outline" style={{ display: 'inline-flex' }}>
              Find a Legal Advisor →
            </a>
          </div>
        </>
      )}
    </>
  );

  if (letterPhase !== 'none') {
    return (
      <div className="results-split">
        <div className="results-left">{resultsContent}</div>
        <div className="results-right">{letterPanel}</div>
      </div>
    );
  }

  return <div className="page">{resultsContent}</div>;
}

// ── App ────────────────────────────────────────────────────────────────

function App() {
  const [screen,    setScreen]    = useState('upload');
  const [file,      setFile]      = useState(null);
  const [extracted, setExtracted] = useState(null);
  const [analysis,  setAnalysis]  = useState(null);
  const [dark, setDark] = useState(() => {
    try {
      const stored = localStorage.getItem('billshield-theme');
      if (stored) return stored === 'dark';
      return window.matchMedia('(prefers-color-scheme: dark)').matches;
    } catch { return false; }
  });

  useEffect(() => {
    if (dark) {
      document.documentElement.classList.remove('light');
    } else {
      document.documentElement.classList.add('light');
    }
    try { localStorage.setItem('billshield-theme', dark ? 'dark' : 'light'); } catch {}
  }, [dark]);

  const reset = () => { setScreen('upload'); setFile(null); setExtracted(null); setAnalysis(null); };

  return (
    <>
      <Nav dark={dark} onToggle={() => setDark(d => !d)} />
      {screen === 'upload' && (
        <UploadScreen onDone={(f, data) => { setFile(f); setExtracted(data); setScreen('sanity'); }} />
      )}
      {screen === 'sanity' && (
        <SanityScreen
          file={file}
          extracted={extracted}
          onDone={data => { setAnalysis(data); setScreen('results'); }}
          onBack={reset}
        />
      )}
      {screen === 'results' && (
        <ResultsScreen
          extracted={extracted}
          analysis={analysis}
        />
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
